<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3200 1200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="5" fill="#c7d2fe"/>
    </pattern>
    <radialGradient id="fade" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.15"/>
    </radialGradient>
    <mask id="m"><rect width="3200" height="1200" fill="url(#fade)"/></mask>
  </defs>
  <rect width="3200" height="1200" fill="url(#bg)"/>
  <rect width="3200" height="1200" fill="url(#dots)" mask="url(#m)" opacity="0.9"/>
</svg>
