  <rect width="3200" height="1200" fill="url(#base)"/>
  <ellipse cx="2700" cy="950" rx="1100" ry="650" fill="url(#warm)"/>
  <ellipse cx="1500" cy="300" rx="1000" ry="600" fill="url(#pink)"/>
