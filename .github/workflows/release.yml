name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

# Merges close together are released in order.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Release PRs opened with this token run CI and can merge on their own.
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # Opens or updates the release PR with the next version and notes, or publishes the
      # release when this push is the merged release PR.
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Squash-merges the release PR as soon as CI passes.
      - name: Auto-merge the release PR
        if: steps.release.outputs.pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: gh pr merge "${{ fromJSON(steps.release.outputs.pr).number }}" --auto --squash
