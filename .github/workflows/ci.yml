name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - id: install
        run: pnpm install --frozen-lockfile

      # Each check runs even if an earlier one failed, so one CI run reports every problem.
      - name: Format
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm format:check

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm lint

      - name: Unused code
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm knip

      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm typecheck

      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test --coverage

      # Builds without secrets. GitHub data and export tokens are only needed at request time.
      - id: build
        name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm build

      # The cache key is Playwright's version, since that decides which Chromium it downloads.
      - id: playwright
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # Outside Vercel, the export also renders in this Chromium (see src/export/playwright.ts).
      - name: Install Chromium
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm exec playwright install --with-deps chromium

      - name: Smoke tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v7
        if: ${{ failure() && steps.build.outcome == 'success' }}
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
